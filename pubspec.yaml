name: app_scanner_card
description: "Scan Danh Thiếp - On-device Business Card Scanner (A51)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI, Navigation & State
  cupertino_icons: ^1.0.8
  go_router: ^14.8.0
  flutter_bloc: ^8.1.6
  intl: ^0.20.3
  camera: ^0.12.2
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  image: ^4.12.0
  google_mlkit_text_recognition: ^1.0.1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
